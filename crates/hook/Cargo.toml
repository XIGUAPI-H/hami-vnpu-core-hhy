[package]
name = "hook"
version.workspace = true
edition.workspace = true

[lib]
name = "vnpu"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
libc = { workspace = true }
limiter = { path = "../limiter" }
once_cell = "1.18"

[features]
default = []
# Kylin lite: hook.rs wait_for_token path (no CoreLimiter / industry stack).
kylin_lite = []
# Full optimized: core_guard (CoreLimiter/LiteSem) + apply_quota meminfo + LLM burst hooks.
optimized = ["limiter/core_scheduler"]
