# Fair A/B env for optimized vs main — ALL keys below are identical on both sides.
# The ONLY intentional difference between A and B is LD_PRELOAD → libvnpu.so path.
#
# Goal: sweep parameters to find where optimized advantage is largest, not to tune
# optimized alone (no MindIE Turbo / TASK_QUEUE_ENABLE=2 only on optimized, etc.).

shared_env:
  # Quota / scheduling (both versions read these)
  NPU_MEM_QUOTA: "16000"
  NPU_PRIORITY: "25"              # sweep: 10, 20, 25, 40, 50
  NPU_FIXED_SHARE_RATIO: "0"      # sweep: 0 vs 1 (with matching priority semantics)

  # vLLM / MindSpeed runtime (identical vLLM flags in sweep script)
  VLLM_PLATFORM: ascend
  VLLM_USE_V1: "1"
  TASK_QUEUE_ENABLE: "1"          # sweep: 0, 1 (same on both; do NOT use 2 on optimized only)
  HCCL_OP_EXPANSION_MODE: AIV
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  OMP_NUM_THREADS: "1"
  VLLM_ASCEND_ENABLE_DENSE_OPTIMIZE: "1"
  VLLM_ASCEND_ENABLE_NZ: "2"
  TORCH_COMPILE_DISABLE: "1"
  VXPU_MEMINFO_USE_DCMI: "0"

  # Hook tuning — set on BOTH runs; main ignores unknown keys harmlessly
  NPU_FCSP_REFILL: "1"            # optimized only; harmless on main
  NPU_FCSP_REFILL_INTERVAL_US: "100"
  NPU_BURST_ALPHA: "0.3"          # sweep: 0.2, 0.3, 0.5
  NPU_BURST_CONTINUOUS: "1"
  NPU_TOKEN_CHUNK: "32"           # sweep: 8, 32, 64 (optimized worker only)

# vLLM CLI — keep identical; sweep via SWEEP_* overrides in compare_perf_param_sweep.sh
vllm_args:
  max_num_seqs: 4                 # sweep: 1, 4, 8
  max_model_len: 4096
  max_num_batched_tokens: 4096
  gpu_memory_utilization: 0.5
  enforce_eager: true

# aisbench — identical load profile per scenario
benchmark:
  num_prompts: 16                 # sweep: 8, 16, 32
  concurrency: 4                  # sweep: 1, 4, 8

# A/B artifact paths on 68 node (only LD_PRELOAD differs)
variants:
  optimized:
    so_dir: /mnt/local/m00953550/FinalTest/openeuler/release
    global_shm: global_registry_perf_release
    local_shm: vnpu_perf_release
  main:
    so_dir: /mnt/local/m00953550/FinalTest/openeuler/release-main
    global_shm: global_registry_perf_main
    local_shm: vnpu_perf_main
