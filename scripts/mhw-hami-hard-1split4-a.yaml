apiVersion: v1
kind: Pod
metadata:
  name: mhw-hami-hard-1split4-a
  namespace: default
  annotations:
    hami.io/gpu-scheduler-policy: "binpack"
  labels:
    app: vllm-hami-hard-1split4-a
spec:
  schedulerName: hami-scheduler
  nodeSelector:
    kubernetes.io/hostname: b04-07-23u-at800t-node-16
  tolerations:
    - operator: "Exists"
  volumes:
    - name: model-storage
      hostPath:
        path: /mnt/local/m00953550/Qwen3-1.7B
        type: Directory
    - name: ascend-driver
      hostPath: { path: /usr/local/Ascend/driver }
    - name: ascend-firmware
      hostPath: { path: /usr/local/Ascend/firmware }
    - name: hccn-conf
      hostPath: { path: /etc/hccn.conf }
    - name: dcmi
      hostPath: { path: /usr/local/dcmi }
    - name: ascend-toolbox
      hostPath: { path: /usr/local/Ascend/toolbox }
    - name: var-log-npu
      hostPath: { path: /var/log/npu/ }
    - name: xpu-bin
      hostPath: { path: /opt/xpu/bin }
    - name: xpu-lib
      hostPath: { path: /opt/xpu/lib }
    - name: xpu-log
      hostPath: { path: /var/log/xpu }
    - name: xpu-sock
      hostPath:
        path: /var/lib/xpu
        type: DirectoryOrCreate
    - name: aisbench
      hostPath: { path: /mnt/local/m00953550/benchmark/ }
    - name: ascend-manager
      hostPath: { path: /dev/davinci_manager }
    - name: devmm-svm
      hostPath: { path: /dev/devmm_svm }
    - name: hisi-hdc
      hostPath: { path: /dev/hisi_hdc }
    - name: my-space
      hostPath: { path: /mnt/project/dongpengmin/base_hami_so/ }
  containers:
    - name: vllm-ascend
      image: quay.io/ascend/vllm-ascend:v0.13.0rc1
      securityContext:
        privileged: true
      env:
        - name: VLLM_PLATFORM
          value: ascend
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          echo "=== vLLM HARD 1split4 (no libvnpu) ==="
          export LD_LIBRARY_PATH=/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64:/usr/local/Ascend/nnae/latest/lib64:$LD_LIBRARY_PATH
          export ASCEND_PROCESS_LOG_PATH=/tmp/vllmlog
          source /usr/local/Ascend/nnal/atb/set_env.sh
          export TASK_QUEUE_ENABLE=1
          export VLLM_USE_V1=1
          export HCCL_OP_EXPANSION_MODE="AIV"
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export OMP_NUM_THREADS=1
          export VLLM_ASCEND_ENABLE_DENSE_OPTIMIZE=1
          export VLLM_ASCEND_ENABLE_NZ=2
          exec python -m vllm.entrypoints.openai.api_server \
            --model=/models \
            --trust-remote-code \
            --distributed-executor-backend mp \
            --tensor-parallel-size 1 \
            --pipeline-parallel-size 1 \
            --disable-frontend-multiprocessing \
            --port 8000 \
            --host 0.0.0.0 \
            --gpu-memory-utilization 0.5 \
            --max-num-seqs 4 \
            --served-model-name qwen3 \
            --dtype bfloat16 \
            --max_model_len 4096 \
            --max-num-batched-tokens 4096 \
            --enable-auto-tool-choice \
            --tool-call-parser hermes \
            --no-enable_expert_parallel \
            --block-size 128 \
            --async-scheduling \
            --distributed_executor_backend "mp" \
            --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4]}' \
            --no-enable-prefix-caching
      resources:
        limits:
          huawei.com/Ascend910-5c.1cpu.16g: "1"
        requests:
          huawei.com/Ascend910-5c.1cpu.16g: "1"
      volumeMounts:
        - { name: model-storage, mountPath: /models, readOnly: true }
        - { name: ascend-driver, mountPath: /usr/local/Ascend/driver, readOnly: true }
        - { name: ascend-firmware, mountPath: /usr/local/Ascend/firmware, readOnly: true }
        - { name: hccn-conf, mountPath: /etc/hccn.conf, readOnly: true }
        - { name: dcmi, mountPath: /usr/local/dcmi, readOnly: true }
        - { name: ascend-toolbox, mountPath: /usr/local/Ascend/toolbox, readOnly: true }
        - { name: var-log-npu, mountPath: /var/log/npu, readOnly: true }
        - { name: xpu-bin, mountPath: /opt/xpu/bin }
        - { name: xpu-sock, mountPath: /var/lib/xpu }
        - { name: xpu-lib, mountPath: /opt/xpu/lib }
        - { name: xpu-log, mountPath: /var/log/xpu }
        - { name: ascend-manager, mountPath: /dev/davinci_manager }
        - { name: devmm-svm, mountPath: /dev/devmm_svm }
        - { name: hisi-hdc, mountPath: /dev/hisi_hdc }
        - { name: aisbench, mountPath: /mnt/local/m00953550/benchmark/ }
        - { name: my-space, mountPath: /mnt/project/dongpengmin/base_hami_so/ }
---
apiVersion: v1
kind: Service
metadata:
  name: mhw-hami-hard-1split4-svc-a
  namespace: default
spec:
  type: NodePort
  selector:
    app: vllm-hami-hard-1split4-a
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30020
